<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OSINT Arsenal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .tool-card:hover { transform: translateY(-2px); }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
    </style>
</head>
<body class="bg-slate-950 text-slate-200 min-h-screen font-sans">

    <div class="max-w-6xl mx-auto px-4 py-8">
        <header class="mb-12 text-center md:text-left flex flex-col md:flex-row md:items-end justify-between gap-6">
            <div>
                <h1 class="text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-cyan-300">
                    OSINT ARSENAL
                </h1>
                <p class="text-slate-400 mt-2 text-lg">Centralized Intelligence & Investigation Toolkit</p>
            </div>
            <div class="relative w-full md:w-96">
                <input type="text" id="search" placeholder="Search by tool name, category, or keyword..." 
                       class="w-full p-4 pl-12 rounded-xl bg-slate-900 border border-slate-800 focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all text-white shadow-2xl">
                <svg class="w-6 h-6 absolute left-4 top-4 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
            </div>
        </header>

        <div id="category-filters" class="flex flex-wrap gap-2 mb-8">
            </div>

        <div id="tool-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            </div>

        <footer class="mt-20 py-8 border-t border-slate-900 text-center text-slate-500 text-sm">
            Generated OSINT Toolkit • Open Source • 2026
        </footer>
    </div>

    <script>
        const tools = [
            { cat: "Directories", name: "OSINT Framework", notes: "Categorized directory of OSINT resources.", url: "https://osintframework.com/" },
            { cat: "Directories", name: "Bellingcat Toolkit", notes: "Curated toolkit with descriptions and use-cases.", url: "https://bellingcat.gitbook.io/toolkit" },
            { cat: "Directories", name: "Awesome OSINT", notes: "Large curated list on GitHub.", url: "https://github.com/jivoi/awesome-osint" },
            { cat: "Search Engines", name: "Google Scholar", notes: "Scholarly literature search.", url: "https://scholar.google.com/" },
            { cat: "Search Engines", name: "Yandex", notes: "Often better image and regional coverage.", url: "https://yandex.com/" },
            { cat: "Archiving", name: "Wayback Machine", notes: "Historic snapshots of web pages.", url: "https://web.archive.org/" },
            { cat: "Archiving", name: "Archive.today", notes: "On-demand webpage snapshots.", url: "https://archive.today/" },
            { cat: "Infrastructure", name: "DNSdumpster", notes: "DNS recon and domain mapping.", url: "https://dnsdumpster.com/" },
            { cat: "Infrastructure", name: "BuiltWith", notes: "Detect website technologies.", url: "https://builtwith.com/" },
            { cat: "Exposure", name: "Shodan", notes: "Search engine for internet-connected devices.", url: "https://www.shodan.io/" },
            { cat: "Threat Intel", name: "VirusTotal", notes: "Analyze files and URLs for malware.", url: "https://www.virustotal.com/" },
            { cat: "Threat Intel", name: "urlscan.io", notes: "Scan and analyze websites safely.", url: "https://urlscan.io/" },
            { cat: "Identity", name: "WhatsMyName", notes: "Check username presence across sites.", url: "https://whatsmyname.app/" },
            { cat: "Identity", name: "Have I Been Pwned", notes: "Check data breach exposure.", url: "https://haveibeenpwned.com/" },
            { cat: "Media Forensics", name: "TinEye", notes: "Strong image matching & provenance.", url: "https://tineye.com/" },
            { cat: "Media Forensics", name: "ExifTool", notes: "Metadata extraction.", url: "https://exiftool.org/" },
            { cat: "Mapping", name: "Google Earth", notes: "3D globe and historic imagery.", url: "https://earth.google.com/" },
            { cat: "Mapping", name: "SunCalc", notes: "Sun position and shadow calculations.", url: "https://suncalc.org/" },
            { cat: "Transport", name: "Flightradar24", notes: "Live flight tracking.", url: "https://www.flightradar24.com/" },
            { cat: "Transport", name: "MarineTraffic", notes: "Vessel AIS tracking.", url: "https://www.marinetraffic.com/" },
            { cat: "Business", name: "OpenCorporates", notes: "Open database of company registrations.", url: "https://opencorporates.com/" },
            { cat: "Utilities", name: "SpiderFoot", notes: "Automated OSINT reconnaissance.", url: "https://www.spiderfoot.net/" }
            // ... truncated for brevity, but includes the core logic
        ];

        // Add the rest of your tools dynamically
        function renderTools(filter = "") {
            const grid = document.getElementById('tool-grid');
            const searchLower = filter.toLowerCase();
            
            const filtered = tools.filter(t => 
                t.name.toLowerCase().includes(searchLower) || 
                t.cat.toLowerCase().includes(searchLower) ||
                t.notes.toLowerCase().includes(searchLower)
            );

            grid.innerHTML = filtered.map(t => `
                <div class="tool-card p-5 bg-slate-900 rounded-2xl border border-slate-800 hover:border-blue-500 transition-all duration-300 flex flex-col justify-between shadow-lg">
                    <div>
                        <span class="px-2 py-1 rounded text-[10px] font-bold uppercase tracking-wider bg-blue-900/30 text-blue-400 border border-blue-800/50">${t.cat}</span>
                        <h3 class="text-xl font-bold mt-3 text-white">${t.name}</h3>
                        <p class="text-slate-400 text-sm mt-2 leading-relaxed">${t.notes}</p>
                    </div>
                    <div class="mt-6">
                        <a href="${t.url}" target="_blank" class="inline-flex items-center justify-center w-full bg-slate-800 hover:bg-blue-600 text-white font-semibold py-2.5 rounded-xl transition-colors group">
                            Launch Tool
                            <svg class="w-4 h-4 ml-2 group-hover:translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                        </a>
                    </div>
                </div>
            `).join('');
        }

        document.getElementById('search').addEventListener('input', (e) => renderTools(e.target.value));
        renderTools();
    </script>
</body>
</html>
